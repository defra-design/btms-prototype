{# Generated by Cursor #}
{% set prototypeVersion = prototypeVersion or 'v6' %}
<ul class="govuk-tabs__list">
  <li class="govuk-tabs__list-item{% if activeTab == 'latest' %} govuk-tabs__list-item--selected{% endif %}">
    <a class="govuk-tabs__tab" href="/mvp/{{ prototypeVersion }}/vrn-search/flowers-declaration-details-tabs?q={{ title | urlencode }}"{% if activeTab == 'latest' %} aria-current="page"{% endif %}>Latest</a>
  </li>
  <li class="govuk-tabs__list-item{% if activeTab == 'timeline' %} govuk-tabs__list-item--selected{% endif %}">
    <a class="govuk-tabs__tab" href="/mvp/{{ prototypeVersion }}/vrn-search/search-results-timeline?q={{ title | urlencode }}"{% if activeTab == 'timeline' %} aria-current="page"{% endif %}>Timeline</a>
  </li>
  {% if showLevel3Tab != false %}
  <li class="govuk-tabs__list-item{% if activeTab == 'level-3' %} govuk-tabs__list-item--selected{% endif %}">
    <a class="govuk-tabs__tab" href="/mvp/{{ prototypeVersion }}/vrn-search/flowers-declaration-details-tabs-level-3?q={{ title | urlencode }}"{% if activeTab == 'level-3' %} aria-current="page"{% endif %}>Level 3 preview</a>
  </li>
  {% endif %}
</ul>
